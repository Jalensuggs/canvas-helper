name: canvas-helper

x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    CANVAS_HELPER_DEPLOYMENT_MODE: server
    CANVAS_HELPER_ENVIRONMENT: production
    CANVAS_HELPER_DATABASE_URL: postgresql+asyncpg://canvas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/canvas
    CANVAS_HELPER_DATA_DIR: /data
    CANVAS_HELPER_PUBLIC_URL: ${CANVAS_HELPER_PUBLIC_URL:?set CANVAS_HELPER_PUBLIC_URL}
    CANVAS_HELPER_CREDENTIAL_ENCRYPTION_KEY: ${CANVAS_HELPER_CREDENTIAL_ENCRYPTION_KEY:?set CANVAS_HELPER_CREDENTIAL_ENCRYPTION_KEY}
    CANVAS_HELPER_EMAIL_BACKEND: smtp
    CANVAS_HELPER_EMAIL_FROM: ${CANVAS_HELPER_EMAIL_FROM:?set CANVAS_HELPER_EMAIL_FROM}
    CANVAS_HELPER_SMTP_HOST: ${CANVAS_HELPER_SMTP_HOST:?set CANVAS_HELPER_SMTP_HOST}
    CANVAS_HELPER_SMTP_PORT: ${CANVAS_HELPER_SMTP_PORT:-587}
    CANVAS_HELPER_SMTP_USERNAME: ${CANVAS_HELPER_SMTP_USERNAME:?set CANVAS_HELPER_SMTP_USERNAME}
    CANVAS_HELPER_SMTP_PASSWORD: ${CANVAS_HELPER_SMTP_PASSWORD:?set CANVAS_HELPER_SMTP_PASSWORD}
    CANVAS_HELPER_SMTP_USE_SSL: ${CANVAS_HELPER_SMTP_USE_SSL:-false}
    # Sign-up is open unless this is set. Comma-separated, e.g. student.uts.edu.au
    CANVAS_HELPER_ALLOWED_EMAIL_DOMAINS: ${CANVAS_HELPER_ALLOWED_EMAIL_DOMAINS:-}
    CANVAS_HELPER_MAGIC_LINK_PER_EMAIL_PER_HOUR: ${CANVAS_HELPER_MAGIC_LINK_PER_EMAIL_PER_HOUR:-5}
    CANVAS_HELPER_MAGIC_LINK_PER_IP_PER_HOUR: ${CANVAS_HELPER_MAGIC_LINK_PER_IP_PER_HOUR:-20}
    CANVAS_HELPER_ACADEMIC_TIMEZONE: ${CANVAS_HELPER_ACADEMIC_TIMEZONE:-Australia/Sydney}
    CANVAS_HELPER_TERM_START_MONTHS: ${CANVAS_HELPER_TERM_START_MONTHS:-1,7}
  volumes:
    - app_data:/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:${CANVAS_HELPER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "canvas_helper.worker"]
    environment:
      <<: *app-env
      CANVAS_HELPER_RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: canvas
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    profiles: ["object-storage"]
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-canvas-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-before-use}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  app_data:
  postgres_data:
  minio_data:
