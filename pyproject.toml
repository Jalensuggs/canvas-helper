[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-helper"
version = "0.1.0"
description = "Local-first Canvas helper backend MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "greenlet>=3.1,<4",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "nh3>=0.2.18,<1",
  "cryptography>=43,<47",
  "keyring>=25,<26",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]

[project.scripts]
canvas-helper-desktop = "canvas_helper.desktop:main"
canvas-helper-worker = "canvas_helper.worker:main"

[project.optional-dependencies]
ai = ["anthropic>=0.40,<1", "openai>=1.50,<3"]
materials = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
]
desktop = ["pyinstaller>=6.11,<7"]

[tool.hatch.build.targets.wheel]
packages = ["backend/canvas_helper"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]
