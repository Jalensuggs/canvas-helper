[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-helper"
version = "0.1.0"
description = "Local-first Canvas helper backend MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "greenlet>=3.1,<4",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "nh3>=0.2.18,<1",
  # >=50 is the floor that clears PYSEC-2026-3552/3553/3554 and
  # GHSA-537c-gmf6-5ccf. This is the library that encrypts stored Canvas and
  # AI credentials, so the old <47 cap was holding back the fixes.
  "cryptography>=50,<51",
  "keyring>=25,<26",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]

[project.scripts]
canvas-helper-desktop = "canvas_helper.desktop:main"
canvas-helper-worker = "canvas_helper.worker:main"

[project.optional-dependencies]
ai = ["anthropic>=0.40,<1", "openai>=1.50,<3"]
materials = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-timeout>=2.3,<3",
  "respx>=0.21,<1",
]
dev = ["ruff>=0.8,<1"]
desktop = ["pyinstaller>=6.11,<7"]

[tool.hatch.build.targets.wheel]
packages = ["backend/canvas_helper"]

# The app runs Alembic itself on startup, so the scripts have to travel with
# the installed package: outside a source checkout there is no repository root
# to find them in.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "canvas_helper/migrations"

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Correctness rules only. Import ordering and syntax modernisation are
# deliberately left out: enabling them would reformat most of the tree and
# bury real findings under churn. Add them in a dedicated pass.
select = ["E", "F", "W", "B", "C4", "ASYNC"]
ignore = [
  "E501",      # line length is enforced by the formatter, not the linter
  "B008",      # FastAPI's Depends() in defaults is the documented idiom
  "B009",      # getattr(sys, "_MEIPASS") is intentional: PyInstaller-only
  "C408",      # dict(...) with keyword arguments reads better in test setup
  "ASYNC109",  # SyncJobQueue.wait takes an explicit timeout by design
  "ASYNC240",  # one-off Path.is_file()/resolve() calls, not hot paths
]
