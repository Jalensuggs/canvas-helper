name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Verify SQLite migrations
        run: |
          export CANVAS_HELPER_DATABASE_URL=sqlite:///./migration-check.db
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "$(alembic heads | awk '{print $1}')"

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: canvas_test
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Upgrade PostgreSQL from empty database
        env:
          CANVAS_HELPER_DATABASE_URL: postgresql+psycopg://canvas:test-password@127.0.0.1:5432/canvas_test
        run: |
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "$(alembic heads | awk '{print $1}')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
