name: Desktop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tauri-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pip install -e ".[desktop]"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # tauri.conf.json declares the backend as an externalBin, so cargo check
      # fails with "resource path ... doesn't exist" unless the sidecar has
      # been frozen for this runner's target triple first. Invoked directly
      # rather than through the npm script, which hardcodes `python3`.
      - run: python scripts/build_sidecar.py
      - run: cargo check
        working-directory: src-tauri

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pip install -e ".[desktop]"
      - run: npm ci
        working-directory: frontend
      # The sidecar embeds frontend/dist via PyInstaller --add-data, so the
      # frontend must be built before it, not by tauri's beforeBuildCommand.
      - run: npm run build
        working-directory: frontend
      - run: npm run desktop:sidecar
        working-directory: frontend
      # Run from the repository root: the tauri CLI locates the project by
      # looking for tauri.conf.json in a subfolder of the working directory,
      # and from frontend/ there is none. It still runs beforeBuildCommand in
      # the frontend directory itself.
      - run: ./frontend/node_modules/.bin/tauri build --no-bundle
