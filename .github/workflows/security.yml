name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  # gitleaks lists the pull request's commits; without this it gets a 403
  # "Resource not accessible by integration" on every pull_request run.
  pull-requests: read

jobs:
  secrets-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject committed private runtime data
        # Anchored to the repository root, matching the /data/ and /materials/
        # entries in .gitignore. An unanchored pattern also matched the
        # backend/canvas_helper/materials/ source package, so this guard failed
        # on every run regardless of what was committed.
        run: |
          ! git ls-files | grep -E '^(data|materials|\.secrets)/|\.db(-shm|-wal)?$|(^|/)\.env$'

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e . pip-audit
      - run: pip-audit
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
