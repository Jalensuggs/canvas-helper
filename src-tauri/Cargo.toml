[package]
name = "canvas-helper-desktop"
version = "0.1.0"
description = "Canvas Helper desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "canvas_helper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
url = "2"
